<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GameLoom · Premium HTML Game Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        /*
         * ⚠️ FIRESTORE SECURITY RULES (IMPORTANT)
         * For this app to function correctly, you need to set your Firestore rules to allow read/write access.
         * For testing/development, you can use test mode rules in the Firebase Console:
         * rules_version = '2';
         * service cloud.firestore {
         * match /databases/{database}/documents {
         * match /{document=**} {
         * allow read, write: if true; 
         * }
         * }
         * }
         */

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, increment, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // ========== 🔥 FIREBASE CONFIG (EXACTLY AS PROVIDED) ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCy5ppRbcHMV1YKtqsrbrwA3GlS3b0P7O8",
            authDomain: "game-store-6779b.firebaseapp.com",
            projectId: "game-store-6779b",
            storageBucket: "game-store-6779b.firebasestorage.app",
            messagingSenderId: "962209191071",
            appId: "1:962209191071:web:6282529b333749cdee3eaa"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.auth = auth;
        window.db = db;
        window.signOut = signOut;
        
        // App State
        window.currentUser = null;
        window.currentView = "store";
        window.allGames = [];
        window.userLibrary = new Map();
        window.userPrefs = JSON.parse(localStorage.getItem('gameLoomPrefs')) || { theme: 'dark' };
        window.activeChatUnsubscribe = null;
        window.activeChatDocUnsubscribe = null;
        window.presenceInterval = null;
        
        // All Emojis (20+)
        const avatarEmojis = ['👾','🦊','🤖','👻','🐉','🐱','🦄','😎','🚀','🔥','💎','👑','🐼','🐸','🐯','🦁','🐙','🦖','👽','🤡','🤠'];

        document.documentElement.setAttribute('data-theme', window.userPrefs.theme);
        
        const appContainer = document.getElementById('app-root');
        
        // Stackable Notification System Fix
        window.showToast = (message, type = "info") => {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            toast.className = `global-toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); // match CSS transition
            }, 4000);
        };
        
        function sanitizeText(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ========== PRIVACY POLICY GATE ==========
        function checkPrivacyPolicy() {
            if (!localStorage.getItem('gameloom_agreed')) {
                const modal = document.createElement('div');
                modal.className = 'fullscreen-modal fade-in';
                modal.style.zIndex = '100000';
                modal.innerHTML = `
                    <div class="glass p-4 rad-lg max-w-800 m-auto" style="max-height: 90vh; overflow-y: auto; text-align:left;">
                        <h2><i class="fas fa-shield-alt text-accent"></i> Welcome to GameLoom</h2>
                        <p class="mt-3 text-muted">Before entering the arcade, you must agree to our community rules:</p>
                        <ul class="mt-3 mb-4 text-muted" style="line-height:1.6; padding-left:1.5rem;">
                            <li><strong>Age Requirement:</strong> You must be 10 years of age or older to use this service.</li>
                            <li><strong>Content Ownership:</strong> You may only upload games you have created or have explicit legal permission to distribute.</li>
                            <li><strong>Prohibited Content:</strong> No illegal, harmful, sexually explicit, or pirated material is allowed.</li>
                            <li><strong>Data Usage:</strong> Your email, profile data, and activity are stored to provide app functionality (friends, chat, library).</li>
                            <li><strong>User Responsibility:</strong> GameLoom hosts game links (e.g., GitHub Pages) provided by users. We do not guarantee file safety. Play at your own risk.</li>
                        </ul>
                        <button class="btn-primary w-100 large focusable" id="agree-btn">I Agree & Enter</button>
                    </div>
                `;
                document.body.appendChild(modal);
                document.getElementById('agree-btn').addEventListener('click', () => {
                    localStorage.setItem('gameloom_agreed', 'true');
                    modal.remove();
                    initFocusSystem(); // Re-init focus
                });
            }
        }

        // ========== ANALYTICS & PRESENCE ==========
        async function initAnalytics() {
            // Track Total Visit (Once per session)
            if (!sessionStorage.getItem('gameloom_visited')) {
                sessionStorage.setItem('gameloom_visited', 'true');
                try {
                    await setDoc(doc(db, "analytics", "main"), { totalVisits: increment(1) }, { merge: true });
                } catch(e) { console.error("Analytics error", e); }
            }

            // Listen to Total Visits
            onSnapshot(doc(db, "analytics", "main"), (docSnap) => {
                const visitsEl = document.getElementById('stat-visits');
                if (visitsEl && docSnap.exists()) {
                    visitsEl.innerHTML = `👁️ ${docSnap.data().totalVisits || 0} Visits`;
                }
            });
            
            updateOnlineStatus(); // Start loop
        }

        async function updateOnlineStatus() {
            // Self-Presence Loop
            if (window.presenceInterval) clearInterval(window.presenceInterval);
            const updatePresence = async () => {
                if (window.currentUser) {
                    try {
                        await updateDoc(doc(db, "users", window.currentUser.uid), { lastActive: Date.now() });
                    } catch(e){}
                }
            };
            updatePresence();
            window.presenceInterval = setInterval(updatePresence, 30000); // 30s

            // Poll online users (last 60s)
            setInterval(async () => {
                try {
                    const snap = await getDocs(collection(db, "users"));
                    let onlineCount = 0;
                    const now = Date.now();
                    snap.forEach(d => {
                        if (d.data().lastActive && (now - d.data().lastActive < 60000)) onlineCount++;
                    });
                    const onlineEl = document.getElementById('stat-online');
                    if(onlineEl) onlineEl.innerHTML = `🟢 ${onlineCount} Online`;
                } catch(e){}
            }, 15000); // Check every 15s
        }

        // ========== CONTROLLER & KEYBOARD NAVIGATION ==========
        function initFocusSystem() {
            window.updateFocusables = () => {
                window.focusables = Array.from(document.querySelectorAll('button, input, select, textarea, .game-card, .focusable, .lib-item'))
                                       .filter(el => el.offsetParent !== null); // Only visible
            };
            
            document.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    window.updateFocusables();
                    let idx = window.focusables.indexOf(document.activeElement);
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') idx = (idx + 1) % window.focusables.length;
                    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') idx = (idx - 1 + window.focusables.length) % window.focusables.length;
                    if(window.focusables[idx]) window.focusables[idx].focus();
                }
            });

            // Gamepad loop
            let lastBtnState = false;
            let lastDPadState = 0; 
            const padLoop = () => {
                const pads = navigator.getGamepads();
                const pad = pads[0] || pads[1] || pads[2] || pads[3];
                if (pad && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    if (pad.buttons[0].pressed && !lastBtnState) {
                        if (document.activeElement && typeof document.activeElement.click === 'function') {
                            document.activeElement.click();
                        }
                    }
                    lastBtnState = pad.buttons[0].pressed;

                    let dPadState = 0;
                    if (pad.axes[1] < -0.5 || pad.axes[0] < -0.5 || (pad.buttons[12] && pad.buttons[12].pressed) || (pad.buttons[14] && pad.buttons[14].pressed)) dPadState = 1; 
                    if (pad.axes[1] > 0.5 || pad.axes[0] > 0.5 || (pad.buttons[13] && pad.buttons[13].pressed) || (pad.buttons[15] && pad.buttons[15].pressed)) dPadState = 2; 
                    
                    if (dPadState !== 0 && lastDPadState === 0) {
                        window.updateFocusables();
                        let idx = window.focusables.indexOf(document.activeElement);
                        if (idx === -1) idx = 0;
                        else if (dPadState === 2) idx = (idx + 1) % window.focusables.length;
                        else if (dPadState === 1) idx = (idx - 1 + window.focusables.length) % window.focusables.length;
                        if(window.focusables[idx]) window.focusables[idx].focus();
                    }
                    lastDPadState = dPadState;
                }
                requestAnimationFrame(padLoop);
            };
            requestAnimationFrame(padLoop);
        }

        // ========== RENDER ENGINE ==========
        function renderApp() {
            if (!window.currentUser) {
                renderAuthScreen();
                return;
            }
            appContainer.innerHTML = `
                <div class="app-layout fade-in">
                    <nav class="sidebar glass">
                        <div class="nav-brand"><i class="fas fa-gamepad"></i> GameLoom</div>
                        <div class="nav-links">
                            <button class="nav-btn active focusable" data-nav="store"><i class="fas fa-store"></i> Store</button>
                            <button class="nav-btn focusable" data-nav="library"><i class="fas fa-layer-group"></i> Library</button>
                            <button class="nav-btn focusable" data-nav="friends"><i class="fas fa-user-friends"></i> Friends</button>
                            <button class="nav-btn focusable" data-nav="uploads"><i class="fas fa-laptop-code"></i> My Uploads</button>
                            <button class="nav-btn focusable" data-nav="upload"><i class="fas fa-cloud-upload-alt"></i> Publish</button>
                        </div>
                        <div class="nav-bottom">
                            <button class="nav-btn focusable" data-nav="settings"><i class="fas fa-cog"></i> Settings</button>
                            <div class="nav-user">
                                <div class="user-avatar">${window.currentUser.photoURL || '👾'}</div>
                                <div class="user-info">
                                    <span class="u-name">${sanitizeText(window.currentUser.displayName || 'Player')}</span>
                                    <button id="logout-btn" class="logout-text focusable">Logout</button>
                                </div>
                            </div>
                        </div>
                    </nav>
                    <main class="main-content">
                        <header class="top-bar glass">
                            <div class="search-wrapper">
                                <i class="fas fa-search"></i>
                                <input type="text" id="global-search" class="focusable" placeholder="Search games, creators...">
                            </div>
                            <div class="top-actions" style="display:flex; gap:1.5rem; align-items:center;">
                                <div class="stats-badges text-muted" style="display:flex; gap:1rem; font-size:0.85rem; font-weight:600;">
                                    <span id="stat-visits">👁️ -- Visits</span>
                                    <span id="stat-online">🟢 -- Online</span>
                                </div>
                                <button class="icon-btn focusable" title="Notifications"><i class="fas fa-bell"></i></button>
                            </div>
                        </header>
                        <div id="dynamic-view" class="dynamic-view"></div>
                    </main>
                </div>
            `;
            
            document.getElementById('logout-btn')?.addEventListener('click', () => { signOut(auth); });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const view = btn.dataset.nav;
                    
                    if (window.activeChatUnsubscribe) { window.activeChatUnsubscribe(); window.activeChatUnsubscribe = null; }
                    if (window.activeChatDocUnsubscribe) { window.activeChatDocUnsubscribe(); window.activeChatDocUnsubscribe = null; }
                    
                    if (view === 'store') navigateToStore();
                    else if (view === 'library') navigateToLibrary();
                    else if (view === 'friends') navigateToFriends();
                    else if (view === 'uploads') navigateToMyUploads();
                    else if (view === 'upload') navigateToUpload();
                    else if (view === 'settings') navigateToSettings();
                });
            });

            document.getElementById('global-search')?.addEventListener('keyup', (e) => {
                window.searchQuery = e.target.value;
                if (window.currentView === 'store') {
                    clearTimeout(window.searchTimeout);
                    window.searchTimeout = setTimeout(() => updateStoreSortAndSearch(), 300);
                } else if (e.key === 'Enter') {
                    document.querySelector('[data-nav="store"]').click();
                }
            });

            if (window.currentView === "store") navigateToStore();
            else if (window.currentView === "library") navigateToLibrary();
            else navigateToStore();
            
            setTimeout(() => window.updateFocusables && window.updateFocusables(), 500);
        }

        // ========== AUTH SCREEN ==========
        function renderAuthScreen() {
            appContainer.innerHTML = `
                <div class="auth-bg">
                    <div class="auth-container fade-in">
                        <div class="auth-card glass">
                            <div class="auth-logo"><i class="fas fa-gamepad"></i> GameLoom</div>
                            <p class="auth-subtitle">The Premium HTML Game Marketplace</p>
                            <div class="auth-tabs">
                                <button id="auth-login-tab" class="auth-tab active focusable">Login</button>
                                <button id="auth-signup-tab" class="auth-tab focusable">Sign Up</button>
                            </div>
                            <div id="auth-form-area">
                                <input type="email" id="auth-email" class="input-modern focusable" placeholder="Email Address">
                                <input type="password" id="auth-password" class="input-modern focusable" placeholder="Password">
                                <input type="text" id="auth-username" class="input-modern hidden focusable" placeholder="Username">
                                <div id="emoji-picker-container" class="hidden">
                                    <label class="form-label mt-2 d-block text-muted">Choose Avatar</label>
                                    <div class="emoji-picker-mini">
                                        ${avatarEmojis.map((e, i) => `<span class="emoji-option focusable ${i===0?'active':''}" data-emoji="${e}" tabindex="0">${e}</span>`).join('')}
                                    </div>
                                </div>
                                <button id="auth-action-btn" class="btn-primary w-100 mt-4 focusable">Enter Arcade <i class="fas fa-arrow-right" style="margin-left:8px;"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            let isLogin = true;
            let selectedEmoji = avatarEmojis[0];

            const toggleMode = (login) => {
                isLogin = login;
                document.getElementById('auth-login-tab').classList.toggle('active', login);
                document.getElementById('auth-signup-tab').classList.toggle('active', !login);
                document.getElementById('auth-username').classList.toggle('hidden', login);
                document.getElementById('emoji-picker-container').classList.toggle('hidden', login);
                document.getElementById('auth-action-btn').innerHTML = login ? 'Enter Arcade <i class="fas fa-arrow-right" style="margin-left:8px;"></i>' : 'Create Account';
                window.updateFocusables && window.updateFocusables();
            };

            document.getElementById('auth-login-tab').addEventListener('click', () => toggleMode(true));
            document.getElementById('auth-signup-tab').addEventListener('click', () => toggleMode(false));

            document.querySelectorAll('.emoji-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.emoji-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    selectedEmoji = opt.dataset.emoji;
                });
                opt.addEventListener('keydown', (e) => { if(e.key==='Enter') opt.click(); });
            });

            document.getElementById('auth-action-btn').addEventListener('click', async () => {
                const email = document.getElementById('auth-email').value;
                const pwd = document.getElementById('auth-password').value;
                const btn = document.getElementById('auth-action-btn');
                
                if (!email || !pwd) return showToast("Please fill all fields", "error");
                
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;

                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, pwd);
                        showToast("Welcome back!", "success");
                    } else {
                        const username = document.getElementById('auth-username').value;
                        if(!username) throw new Error("Username required");
                        const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                        await updateProfile(cred.user, { displayName: username, photoURL: selectedEmoji });
                        await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, username, email, emoji: selectedEmoji, createdAt: serverTimestamp(), lastActive: Date.now() });
                        showToast("Account created successfully!", "success");
                    }
                } catch(e) { 
                    showToast(e.message.replace('Firebase: ', ''), "error"); 
                    btn.disabled = false;
                    btn.innerHTML = isLogin ? 'Enter Arcade <i class="fas fa-arrow-right" style="margin-left:8px;"></i>' : 'Create Account';
                }
            });
        }

        // ========== DATA LAYER ==========
        async function fetchGames() {
            try {
                const q = query(collection(db, "games"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                window.allGames = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (e) {
                if(window.allGames.length === 0) showToast("Could not load games (check DB rules)", "error");
            }
        }

        async function fetchLibrary() {
            if (!window.currentUser) return;
            try {
                const localData = localStorage.getItem(`gameLoomLibrary_${window.currentUser.uid}`);
                const libItems = localData ? JSON.parse(localData) : [];
                window.userLibrary.clear();
                libItems.forEach(item => window.userLibrary.set(item.gameId, item));
            } catch(e) { console.error("Library fetch error", e); }
        }

        function showLoader(container) {
            container.innerHTML = `
                <div class="loader-container fade-in">
                    <div class="skeleton-banner"></div>
                    <div class="games-grid mt-3">
                        <div class="skeleton-card"></div><div class="skeleton-card"></div>
                    </div>
                </div>
            `;
        }

        // ========== STORE VIEWS ==========
        window.updateStoreSortAndSearch = () => {
            const sq = window.searchQuery ? window.searchQuery.toLowerCase().trim() : "";
            let filtered = window.allGames.filter(g => !sq || 
                g.title?.toLowerCase().includes(sq) || 
                g.creator?.toLowerCase().includes(sq) || 
                g.tags?.some(t=>t.toLowerCase().includes(sq)));
                
            const sortVal = document.getElementById('sort-select')?.value || 'newest';
            
            if(sortVal === 'popular') filtered.sort((a,b)=>(b.likes||0)-(a.likes||0));
            else filtered.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
            
            const grid = document.getElementById('games-grid');
            if(!grid) return;
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state glass"><h3>No games found</h3><p>Try adjusting your search.</p></div>`;
                return;
            }
            grid.innerHTML = filtered.map(game => {
                const isInstalled = window.userLibrary.has(game.id);
                const isNew = (Date.now() - (game.createdAt?.toMillis() || 0)) < 604800000;
                return `
                <div class="game-card glass focusable" tabindex="0" onclick="navigateToGameDetail('${game.id}')" onkeydown="if(event.key==='Enter')this.click()">
                    <div class="game-image-wrapper">
                        <img src="${game.iconURL || game.iconUrl || 'https://placehold.co/400x300/1e293b/ffffff?text=🎮'}" loading="lazy">
                        ${isNew ? '<span class="card-badge">NEW</span>' : ''}
                    </div>
                    <div class="game-info">
                        <h3 class="truncate">${sanitizeText(game.title)}</h3>
                        <p class="creator-name">by ${sanitizeText(game.creator)}</p>
                        <div class="game-meta">
                            <span><i class="fas fa-thumbs-up text-accent"></i> <span id="store-likes-${game.id}">${game.likes || 0}</span></span>
                            <span><i class="fas fa-thumbs-down text-danger"></i> <span id="store-dislikes-${game.id}">${game.dislikes || 0}</span></span>
                        </div>
                        <button class="btn-install w-100 mt-2 focusable ${isInstalled ? 'installed' : ''}" id="store-install-${game.id}" tabindex="0" onclick="event.stopPropagation(); toggleInstall('${game.id}')">
                            ${isInstalled ? '<i class="fas fa-check"></i> In Library' : '<i class="fas fa-download"></i> Add to Library'}
                        </button>
                    </div>
                </div>
            `}).join('');
            setTimeout(() => window.updateFocusables && window.updateFocusables(), 100);
        };

        window.navigateToStore = async () => {
            window.currentView = "store";
            const viewDiv = document.getElementById('dynamic-view');
            showLoader(viewDiv);
            await fetchGames();
            await fetchLibrary();
            
            const featured = [...window.allGames].sort((a,b)=>(b.likes||0)-(a.likes||0)).slice(0, 3);
            const sq = window.searchQuery ? window.searchQuery.toLowerCase().trim() : "";

            viewDiv.innerHTML = `
                <div class="fade-in">
                    ${featured.length > 0 && !sq ? `
                    <div class="hero-carousel glass">
                        <div class="hero-content">
                            <span class="badge badge-accent">Featured</span>
                            <h1 class="hero-title">${sanitizeText(featured[0].title)}</h1>
                            <p class="hero-desc">${sanitizeText(featured[0].description).substring(0, 150)}...</p>
                            <div class="hero-actions">
                                <button class="btn-primary focusable" onclick="navigateToGameDetail('${featured[0].id}')">View Details</button>
                            </div>
                        </div>
                        <div class="hero-image" style="background-image: url('${featured[0].screenshots?.[0] || featured[0].iconURL || featured[0].iconUrl || 'https://placehold.co/800x400/111827/ffffff?text=No+Image'}')"></div>
                    </div>` : ''}
                    
                    <div class="section-header mt-4">
                        <h2>${sq ? `Search Results for "${sq}"` : 'Discover Games'}</h2>
                        <div class="filters">
                            <select id="sort-select" class="input-modern slim focusable">
                                <option value="newest">Newest Releases</option>
                                <option value="popular">Most Popular</option>
                            </select>
                        </div>
                    </div>
                    <div class="games-grid" id="games-grid"></div>
                </div>
            `;

            document.getElementById('sort-select')?.addEventListener('change', updateStoreSortAndSearch);
            updateStoreSortAndSearch();
        };

        window.navigateToLibrary = async () => {
            window.currentView = "library";
            const viewDiv = document.getElementById('dynamic-view');
            showLoader(viewDiv);
            await fetchGames();
            await fetchLibrary();

            const libGames = window.allGames.filter(g => window.userLibrary.has(g.id));
            libGames.sort((a,b) => (window.userLibrary.get(b.id).lastPlayed || 0) - (window.userLibrary.get(a.id).lastPlayed || 0));

            viewDiv.innerHTML = `
                <div class="fade-in">
                    <div class="section-header"><h2><i class="fas fa-layer-group text-accent"></i> My Library</h2></div>
                    ${libGames.length === 0 ? `
                        <div class="empty-state glass">
                            <i class="fas fa-box-open fa-3x mb-3 text-muted"></i>
                            <h3>Your library is empty</h3>
                            <button class="btn-primary mt-3 focusable" onclick="document.querySelector('[data-nav=\\'store\\']').click()">Go to Store</button>
                        </div>
                    ` : `
                        <div class="library-list">
                            ${libGames.map(game => {
                                const libData = window.userLibrary.get(game.id);
                                const lastPlayedStr = libData.lastPlayed ? new Date(libData.lastPlayed).toLocaleDateString() : 'Never';
                                return `

        // ========== FRIENDS & CHAT ==========
        window.navigateToFriends = async () => {
            window.currentView = "friends";
            const viewDiv = document.getElementById('dynamic-view');
            viewDiv.innerHTML = `
                <div class="fade-in" style="display:flex; gap:2rem; height:calc(100vh - 150px);">
                    <div class="glass p-4 rad-lg" style="width:300px; display:flex; flex-direction:column; box-sizing:border-box;">
                        <h3 class="mb-3"><i class="fas fa-users text-accent"></i> Friends</h3>
                        <div class="search-wrapper mb-3 w-100" style="max-width:100%;">
                            <input type="text" id="friend-search" class="focusable" placeholder="Search email/username...">

        window.searchUser = async () => {
            const val = document.getElementById('friend-search').value.trim();
            if(!val) return;
            try {
                let q = query(collection(db, "users"), where("email", "==", val));
                let snap = await getDocs(q);
                if(snap.empty) {
                    q = query(collection(db, "users"), where("username", "==", val));
                    snap = await getDocs(q);
                }
                if(snap.empty) return showToast("User not found", "error");
                
                const user = snap.docs[0].data();
                if(user.uid === window.currentUser.uid) return showToast("That's you!", "info");
                
                await setDoc(doc(db, "users", window.currentUser.uid, "friends", user.uid), {
                    uid: user.uid, username: user.username, emoji: user.emoji, addedAt: Date.now()
                });
                await setDoc(doc(db, "users", user.uid, "friends", window.currentUser.uid), {
                    uid: window.currentUser.uid, username: window.currentUser.displayName, emoji: window.currentUser.photoURL, addedAt: Date.now()
                });
                
                showToast("Friend added!", "success");
                loadFriendsList();
            } catch(e) { showToast("Search failed", "error"); }
        };

        async function loadFriendsList() {
            try {
                const snap = await getDocs(collection(db, "users", window.currentUser.uid, "friends"));
                const list = document.getElementById('friends-list');
                if(!list) return;
                
                if(snap.empty) {
                    list.innerHTML = `<p class="text-muted text-center mt-3" style="font-size:0.9rem;">No friends yet.</p>`;
                    return;
                }
                
                let html = '';
                for (let d of snap.docs) {
                    const f = d.data();
                    const userSnap = await getDoc(doc(db, "users", f.uid));
                    const isOnline = userSnap.exists() && (Date.now() - (userSnap.data().lastActive || 0) < 60000);
                    const statusDot = isOnline ? '<div class="status-dot online"></div>' : '<div class="status-dot offline"></div>';

                    html += `
                        <div class="lib-item glass focusable" style="padding:0.6rem; cursor:pointer;" onclick="openChat('${f.uid}', '${f.username}')" tabindex="0">
                            <div class="user-avatar" style="width:35px; height:35px; position:relative;">
                                ${f.emoji||'👾'}
                                ${statusDot}
                            </div>
                            <div class="lib-details"><h4 style="font-size:1rem; margin:0;">${sanitizeText(f.username)}</h4></div>
                        </div>
                    `;
                }
                list.innerHTML = html;
                setTimeout(() => window.updateFocusables && window.updateFocusables(), 100);
            } catch(e) { console.error(e); }
        }

        window.openChat = (friendId, friendName) => {
            if(window.activeChatUnsubscribe) { window.activeChatUnsubscribe(); window.activeChatUnsubscribe = null; }
            if(window.activeChatDocUnsubscribe) { window.activeChatDocUnsubscribe(); window.activeChatDocUnsubscribe = null; }
            
            const chatId = window.currentUser.uid < friendId ? `${window.currentUser.uid}_${friendId}` : `${friendId}_${window.currentUser.uid}`;
            const chatRef = doc(db, "chats", chatId);
            
            const chatCont = document.getElementById('chat-container');
            chatCont.innerHTML = `
                <div class="game-toolbar" style="padding:1rem; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap:1rem;">
                    <h3 style="margin:0;"><i class="fas fa-comment text-accent"></i> ${sanitizeText(friendName)}</h3>
                    <span id="chat-header-status" class="badge badge-subtle">...</span>
                </div>
                <div id="chat-messages" style="flex:1; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; gap:1rem; scroll-behavior:smooth;">
                    <div class="text-center text-muted"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
                <div id="typing-indicator" style="padding: 0 1.5rem; font-size: 0.8rem; color: var(--text-muted); display: none; font-style: italic;">
                    ${sanitizeText(friendName)} is typing...
                </div>
                <div style="padding:1rem; border-top:1px solid rgba(255,255,255,0.1); display:flex; gap:0.5rem; background:rgba(0,0,0,0.2);">

                    <button id="send-msg-btn" class="btn-primary focusable"><i class="fas fa-paper-plane"></i></button>
                </div>
            `;
            
            getDoc(doc(db, "users", friendId)).then(uSnap => {
                if(uSnap.exists()) {
                    const isOnline = (Date.now() - (uSnap.data().lastActive || 0) < 60000);
                    document.getElementById('chat-header-status').innerHTML = isOnline ? '🟢 Online' : '⚫ Offline';
                }
            });

            setTimeout(() => window.updateFocusables && window.updateFocusables(), 100);

            window.activeChatDocUnsubscribe = onSnapshot(chatRef, (docSnap) => {
                const data = docSnap.data() || {};
                const typingObj = data.typing || {};
                const isTyping = typingObj[friendId] && (Date.now() - typingObj[friendId] < 4000);
                const ind = document.getElementById('typing-indicator');
                if(ind) ind.style.display = isTyping ? 'block' : 'none';
            });

            document.getElementById('msg-input').addEventListener('input', () => {
                setDoc(chatRef, { typing: { [window.currentUser.uid]: Date.now() } }, { merge: true });
            });

            document.getElementById('send-msg-btn').addEventListener('click', async () => {
                const input = document.getElementById('msg-input');
                const text = input.value.trim();
                if(!text) return;
                input.value = '';
                try {
                    await addDoc(collection(db, "chats", chatId, "messages"), {
                        senderId: window.currentUser.uid, text: text, seen: false, createdAt: serverTimestamp()
                    });
                } catch(e) { showToast("Failed to send", "error"); }
            });

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            window.activeChatUnsubscribe = onSnapshot(q, (snap) => {
                const msgBox = document.getElementById('chat-messages');
                if(!msgBox) return;
                
                if(snap.empty) {
                    msgBox.innerHTML = '<p class="text-muted text-center mt-auto mb-auto">Say hello!</p>';
                    return;
                }
                
                let html = '';
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.senderId === window.currentUser.uid;
                    
                    if (!isMe && !m.seen) {
                        updateDoc(d.ref, { seen: true });
                    }
                    
                    const tick = isMe ? `<div class="msg-status">${m.seen ? '✓✓' : '✓'}</div>` : '';
                    
                    html += `
                        <div style="max-width:70%; align-self: ${isMe ? 'flex-end' : 'flex-start'};">
                            <div style="background: ${isMe ? 'var(--accent)' : 'rgba(255,255,255,0.1)'}; padding:0.8rem 1rem; border-radius:18px; ${isMe ? 'border-bottom-right-radius:4px;' : 'border-bottom-left-radius:4px;'}">
                                ${sanitizeText(m.text)}
                                ${tick}
                            </div>
                        </div>

                msgBox.scrollTop = msgBox.scrollHeight;

                        btn.className = `btn-install w-100 mt-2 focusable ${nowInstalled ? 'installed' : ''}`;

                                      <div class="c-avatar">${c.authorEmoji || '👾'}</div>

                                          <div class="comment-actions mt-2" style="display:flex; gap:0.6rem; align-items:center;">
                                              <button class="btn-icon focusable" style="width:28px; height:28px; font-size:0.8rem; background:rgba(0,0,0,0.3);" id="c-vote-like-${c.id}" onclick="toggleCommentVote('${c.id}', 'like')">
                                                  <i class="fas fa-thumbs-up ${(userCommentVotes[c.id]==='like')?'text-accent':''}"></i>
                                              </button>
                                              <span class="text-muted" style="font-size:0.85rem; font-weight:600;" id="c-count-like-${c.id}">${c.likes || 0}</span>
                                              <button class="btn-icon focusable" style="width:28px; height:28px; font-size:0.8rem; background:rgba(0,0,0,0.3);" id="c-vote-dislike-${c.id}" onclick="toggleCommentVote('${c.id}', 'dislike')">
                                                  <i class="fas fa-thumbs-down ${(userCommentVotes[c.id]==='dislike')?'text-danger':''}"></i>
                                              </button>
                                              <span class="text-muted" style="font-size:0.85rem; font-weight:600;" id="c-count-dislike-${c.id}">${c.dislikes || 0}</span>
                                          </div>
                                      </div>
                                  </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="mt-5">
                            <h3 class="mb-3"><i class="fas fa-compass text-accent"></i> Suggested Games</h3>
                            <div class="suggested-games">
                                ${suggestedHtml}

                        </div>
                    </div>
                `;
                setTimeout(() => window.updateFocusables && window.updateFocusables(), 100);
            } catch(e) { navigateToStore(); }
        };

        // NO RELOAD Toggle Vote
        window.toggleVote = async (gameId, voteType) => {
            if (!window.currentUser) return showToast("Log in to vote", "error");
            
            // UI Feedback
            const btn = document.getElementById(`vote-${voteType}-${gameId}`);
            if(btn) { btn.classList.remove('pop-anim'); void btn.offsetWidth; btn.classList.add('pop-anim'); }

            const voteId = `${window.currentUser.uid}_${gameId}`;
            const voteRef = doc(db, "votes", voteId);
            const gameRef = doc(db, "games", gameId);
            
            try {
                const voteSnap = await getDoc(voteRef);
                let currentVote = voteSnap.exists() ? voteSnap.data().type : null;

                const likeBtn = document.getElementById(`vote-like-${gameId}`);
                const dislikeBtn = document.getElementById(`vote-dislike-${gameId}`);
                const likeCountEl = document.getElementById(`count-like-${gameId}`);
                const dislikeCountEl = document.getElementById(`count-dislike-${gameId}`);

                let likes = parseInt(likeCountEl?.innerText || "0");
                let dislikes = parseInt(dislikeCountEl?.innerText || "0");

                if (currentVote === voteType) {
                    await deleteDoc(voteRef);
                    await updateDoc(gameRef, { [voteType + 's']: increment(-1) });
                    if(voteType === 'like') { likes--; if(likeBtn) likeBtn.classList.remove('text-accent'); }
                    if(voteType === 'dislike') { dislikes--; if(dislikeBtn) dislikeBtn.classList.remove('text-danger'); }
                } else {
                    await setDoc(voteRef, { gameId, userId: window.currentUser.uid, type: voteType, createdAt: serverTimestamp() });
                    const updates = { [voteType + 's']: increment(1) };
                    
                    if(voteType === 'like') { likes++; if(likeBtn) likeBtn.classList.add('text-accent'); }
                    if(voteType === 'dislike') { dislikes++; if(dislikeBtn) dislikeBtn.classList.add('text-danger'); }

                    if (currentVote) {
                        updates[currentVote + 's'] = increment(-1);
                        if(currentVote === 'like') { likes--; if(likeBtn) likeBtn.classList.remove('text-accent'); }
                        if(currentVote === 'dislike') { dislikes--; if(dislikeBtn) dislikeBtn.classList.remove('text-danger'); }
                    }
                    await updateDoc(gameRef, updates);
                }
                
                if(likeCountEl) likeCountEl.innerText = Math.max(0, likes);
                if(dislikeCountEl) dislikeCountEl.innerText = Math.max(0, dislikes);

                // Update cache
                const gameObj = window.allGames.find(g => g.id === gameId);
                if(gameObj) { gameObj.likes = Math.max(0, likes); gameObj.dislikes = Math.max(0, dislikes); }

            } catch(e) { showToast("Error updating vote", "error"); }
        };

        // NO RELOAD Comment Vote
        window.toggleCommentVote = async (commentId, voteType) => {
            if (!window.currentUser) return showToast("Log in to vote", "error");
            
            const btn = document.getElementById(`c-vote-${voteType}-${commentId}`);
            if(btn) { btn.classList.remove('pop-anim'); void btn.offsetWidth; btn.classList.add('pop-anim'); }

            const voteId = `${window.currentUser.uid}_${commentId}`;
            const voteRef = doc(db, "comment_votes", voteId);
            const commentRef = doc(db, "comments", commentId);
            
            try {
                const voteSnap = await getDoc(voteRef);
                let currentVote = voteSnap.exists() ? voteSnap.data().type : null;

                const likeIcon = document.querySelector(`#c-vote-like-${commentId} i`);
                const dislikeIcon = document.querySelector(`#c-vote-dislike-${commentId} i`);
                const likeCountEl = document.getElementById(`c-count-like-${commentId}`);
                const dislikeCountEl = document.getElementById(`c-count-dislike-${commentId}`);

                let likes = parseInt(likeCountEl?.innerText || "0");
                let dislikes = parseInt(dislikeCountEl?.innerText || "0");

                if (currentVote === voteType) {
                    await deleteDoc(voteRef);
                    await updateDoc(commentRef, { [voteType + 's']: increment(-1) });
                    if(voteType === 'like') { likes--; if(likeIcon) likeIcon.classList.remove('text-accent'); }
                    if(voteType === 'dislike') { dislikes--; if(dislikeIcon) dislikeIcon.classList.remove('text-danger'); }
                } else {
                    await setDoc(voteRef, { commentId, userId: window.currentUser.uid, type: voteType, createdAt: serverTimestamp() });
                    const updates = { [voteType + 's']: increment(1) };
                    
                    if(voteType === 'like') { likes++; if(likeIcon) likeIcon.classList.add('text-accent'); }
                    if(voteType === 'dislike') { dislikes++; if(dislikeIcon) dislikeIcon.classList.add('text-danger'); }

                    if (currentVote) {
                        updates[currentVote + 's'] = increment(-1);
                        if(currentVote === 'like') { likes--; if(likeIcon) likeIcon.classList.remove('text-accent'); }
                        if(currentVote === 'dislike') { dislikes--; if(dislikeIcon) dislikeIcon.classList.remove('text-danger'); }
                    }
                    await updateDoc(commentRef, updates);
                }
                
                if(likeCountEl) likeCountEl.innerText = Math.max(0, likes);
                if(dislikeCountEl) dislikeCountEl.innerText = Math.max(0, dislikes);

            } catch(e) { showToast("Error updating comment vote", "error"); }
        };

        // NO RELOAD Post Comment
        window.postComment = async (gameId) => {
            const input = document.getElementById('new-comment');
            const text = input.value.trim();
            const btn = document.getElementById('post-comment-btn');
            if(!text) return;
            
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
            
            try {
                const newDoc = await addDoc(collection(db,"comments"), { 
                    gameId: gameId, userId: window.currentUser.uid, text: text,
                    authorName: window.currentUser.displayName || "Player", authorEmoji: window.currentUser.photoURL || '👾',
                    email: window.currentUser.email, createdAt: serverTimestamp(),
                    likes: 0, dislikes: 0
                });
                
                showToast("Comment posted!", "success");
                input.value = '';
                
                const commentsList = document.getElementById(`comments-list-${gameId}`);
                const noCommentsMsg = document.getElementById('no-comments-msg');
                if(noCommentsMsg) noCommentsMsg.remove();
                
                const html = `
                  <div class="comment-item fade-in" id="comment-${newDoc.id}">
                      <div class="c-avatar">${window.currentUser.photoURL || '👾'}</div>
                      <div class="c-content">
                          <div class="c-header"><strong>${sanitizeText(window.currentUser.displayName || window.currentUser.email)}</strong> <span class="c-date text-muted" style="font-size:0.8rem; margin-left:8px;">Just now</span></div>
                          <p style="margin-top:0.3rem;">${sanitizeText(text)}</p>
                          <div class="comment-actions mt-2" style="display:flex; gap:0.6rem; align-items:center;">
                              <button class="btn-icon focusable" style="width:28px; height:28px; font-size:0.8rem; background:rgba(0,0,0,0.3);" id="c-vote-like-${newDoc.id}" onclick="toggleCommentVote('${newDoc.id}', 'like')"><i class="fas fa-thumbs-up"></i></button>
                              <span class="text-muted" style="font-size:0.85rem; font-weight:600;" id="c-count-like-${newDoc.id}">0</span>
                              <button class="btn-icon focusable" style="width:28px; height:28px; font-size:0.8rem; background:rgba(0,0,0,0.3);" id="c-vote-dislike-${newDoc.id}" onclick="toggleCommentVote('${newDoc.id}', 'dislike')"><i class="fas fa-thumbs-down"></i></button>
                              <span class="text-muted" style="font-size:0.85rem; font-weight:600;" id="c-count-dislike-${newDoc.id}">0</span>
                          </div>
                      </div>
                  </div>
                `;
                commentsList.insertAdjacentHTML('afterbegin', html);
            } catch(e) { 
                showToast("Error posting comment", "error"); 
            } finally {
                btn.disabled = false;
                btn.innerText = "Post Comment";
            }
        };

        window.launchGame = async (gameId) => {
            const gameDoc = await getDoc(doc(db,"games",gameId));
            if(!gameDoc.exists()) return;
            const game = gameDoc.data();
            
            if(window.userLibrary.has(gameId)) {
                const ld = window.userLibrary.get(gameId);
                ld.lastPlayed = Date.now();
                window.userLibrary.set(gameId, ld);
                localStorage.setItem(`gameLoomLibrary_${window.currentUser.uid}`, JSON.stringify(Array.from(window.userLibrary.values())));
            }

            const playUrl = game.gameURL || game.gameFileUrl;
            if(playUrl) {
                const modal = document.createElement('div');
                modal.className = 'fullscreen-modal fade-in';
                modal.innerHTML = `
                    <div class="game-toolbar glass">
                        <span class="game-title-bar"><i class="fas fa-gamepad"></i> ${sanitizeText(game.title)}</span>
                        <button class="btn-icon text-muted focusable" onclick="this.closest('.fullscreen-modal').remove(); document.body.style.overflow='auto'; window.updateFocusables();" style="z-index:99999;"><i class="fas fa-times fa-lg"></i></button>
                    </div>
                    <iframe class="game-iframe" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" src="${playUrl}"></iframe>
                `;
                document.body.appendChild(modal);
                document.body.style.overflow = 'hidden';
            } else showToast("Game URL not found.", "error"); 
        };

        window.navigateToUpload = () => {
            window.currentView = "upload";
            const viewDiv = document.getElementById('dynamic-view');
            viewDiv.innerHTML = `
                <div class="fade-in max-w-800 m-auto">
                    <div class="section-header"><h2><i class="fas fa-cloud-upload-alt text-accent"></i> Publish Game</h2></div>
                    <div class="glass p-4 rad-lg upload-form">
                        <div class="legal-warning mb-4"><i class="fas fa-gavel"></i> <strong>Publisher Agreement:</strong> Games are hosted via external URLs. You confirm you own all rights.</div>
                        <div class="form-group"><label>Game Title *</label><input type="text" id="up-title" class="input-modern focusable"></div>
                        <div class="form-group"><label>Studio / Creator Name *</label><input type="text" id="up-creator" class="input-modern focusable" value="${sanitizeText(window.currentUser.displayName || '')}"></div>
                        <div class="form-group"><label>Description *</label><textarea id="up-desc" class="input-modern focusable" rows="4"></textarea></div>
                        <div class="row-2">
                            <div class="form-group"><label>Category</label><select id="up-category" class="input-modern focusable"><option>Action</option><option>Puzzle</option><option>RPG</option><option>Platformer</option><option>Simulation</option></select></div>
                            <div class="form-group"><label>Tags (comma separated)</label><input type="text" id="up-tags" class="input-modern focusable" placeholder="e.g. pixel-art, retro"></div>
                        </div>
                        <div class="form-group"><label>Game Icon URL (1:1) *</label><input type="url" id="up-icon" class="input-modern focusable" placeholder="https://example.com/icon.png"></div>
                        <div class="form-group">
                            <label>Screenshots URLs (comma separated)</label>
                            <input type="text" id="up-screenshots" class="input-modern focusable" placeholder="https://url1.com/img.png, https://url2.com/img.png">
                            <small class="text-muted mt-1 d-block">Separate multiple image URLs with commas.</small>
                        </div>
                        <div class="form-group"><label>GitHub Game URL *</label><input type="url" id="up-file" class="input-modern focusable" placeholder="https://yourname.github.io/game/"></div>
                        <button id="submit-upload-btn" class="btn-primary large w-100 mt-4 focusable"><i class="fas fa-rocket"></i> Publish to GameLoom</button>
                    </div>
                </div>
            `;
            setTimeout(() => window.updateFocusables && window.updateFocusables(), 100);

            document.getElementById('submit-upload-btn').addEventListener('click', async function() {
                const title = document.getElementById('up-title').value.trim();
                const creator = document.getElementById('up-creator').value.trim();
                const desc = document.getElementById('up-desc').value.trim();
                const cat = document.getElementById('up-category').value;
                const tags = document.getElementById('up-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
                const iconUrl = document.getElementById('up-icon').value.trim();
                const ssUrls = document.getElementById('up-screenshots').value.trim().split(',').map(s=>s.trim()).filter(Boolean);
                const gameUrl = document.getElementById('up-file').value.trim();

                if(!title || !creator || !desc || !iconUrl || !gameUrl) return showToast("Fill required fields.", "error");

                this.disabled = true; this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';
                try {
                    await addDoc(collection(db, "games"), {
                        title, creator, description: desc, category: cat, tags, iconURL: iconUrl, screenshots: ssUrls, gameURL: gameUrl,
                        likes: 0, dislikes: 0, downloads: 0, ownerId: window.currentUser.uid, createdAt: serverTimestamp()
                    });
                    showToast("Game Published!", "success");
                    navigateToMyUploads();
                } catch(e) { showToast("Publish failed", "error"); this.disabled = false; this.innerHTML = '<i class="fas fa-rocket"></i> Publish'; }
            });
        };

        window.navigateToSettings = () => {
            window.currentView = "settings";
            const viewDiv = document.getElementById('dynamic-view');
            viewDiv.innerHTML = `
                <div class="fade-in max-w-800 m-auto">
                    <div class="section-header"><h2><i class="fas fa-cog text-accent"></i> Preferences</h2></div>
                    <div class="glass p-4 rad-lg mb-4">
                        <h3>Profile</h3>
                        <div class="settings-row mt-3"><label>Display Name</label><input type="text" id="set-name" class="input-modern focusable" value="${sanitizeText(window.currentUser.displayName || '')}"></div>
                        <div class="settings-row mt-3"><label>Avatar</label>
                            <div class="emoji-picker-mini" id="set-emoji" style="max-height:150px; overflow-y:auto; gap:0.5rem; justify-content:flex-start;">
                                ${avatarEmojis.map(e => `<span class="emoji-option focusable ${window.currentUser.photoURL === e ? 'active' : ''}" data-emoji="${e}" tabindex="0">${e}</span>`).join('')}
                            </div>
                        </div>
                        <button class="btn-primary mt-3 focusable" onclick="saveProfile()"><i class="fas fa-save"></i> Save Profile</button>
                    </div>

                    <div class="glass p-4 rad-lg mb-4">
                        <h3>App Settings</h3>
                        <div class="settings-row mt-3"><label>Theme</label>
                            <select id="set-theme" class="input-modern focusable" onchange="updateTheme(this.value)">
                                <option value="dark" ${window.userPrefs.theme==='dark'?'selected':''}>Dark Space (Default)</option>
                                <option value="darker" ${window.userPrefs.theme==='darker'?'selected':''}>Midnight Obsidian</option>
                                <option value="darkBlueNeon" ${window.userPrefs.theme==='darkBlueNeon'?'selected':''}>Dark Blue Neon</option>
                                <option value="purple" ${window.userPrefs.theme==='purple'?'selected':''}>Neon Purple</option>
                                <option value="purpleGradient" ${window.userPrefs.theme==='purpleGradient'?'selected':''}>Purple Gradient</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => window.updateFocusables && window.updateFocusables(), 100);

            document.querySelectorAll('#set-emoji .emoji-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('#set-emoji .emoji-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                });
                opt.addEventListener('keydown', (e) => { if(e.key==='Enter') opt.click(); });
            });
        };

        window.saveProfile = async () => {
            const name = document.getElementById('set-name').value;
            const emoji = document.querySelector('#set-emoji .emoji-option.active')?.dataset.emoji || '👾';
            try {
                await updateProfile(window.currentUser, { displayName: name, photoURL: emoji });
                await updateDoc(doc(db, "users", window.currentUser.uid), { username: name, emoji });
                showToast("Profile updated", "success");
                renderApp(); 
            } catch(e) { showToast("Failed to update profile", "error"); }
        };

        window.updateTheme = (themeStr) => {
            document.documentElement.setAttribute('data-theme', themeStr);
            window.userPrefs.theme = themeStr;
            localStorage.setItem('gameLoomPrefs', JSON.stringify(window.userPrefs));
        };

        // ========== INIT ==========
        onAuthStateChanged(auth, async (user) => {
            window.currentUser = user;
            if(user) { 
                checkPrivacyPolicy();
                initAnalytics();
                initFocusSystem();
                await fetchLibrary(); 
                renderApp(); 
            } else {
                if(window.presenceInterval) clearInterval(window.presenceInterval);
                renderAuthScreen();
            }
        });

    </script>

        /* === AUTH === */

        /* === LAYOUT === */

        /* === HERO CAROUSEL === */
        .hero-carousel { position: relative; height: 380px; border-radius: 30px; overflow: hidden; display: flex; align-items: center; padding: 3rem; margin-bottom: 2rem; }
        .hero-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; opacity: 0.6; filter: blur(4px) brightness(0.7); transform: scale(1.05); }

        .btn-install.installed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        /* === LIBRARY / UPLOADS LIST === */
        .library-list { display: flex; flex-direction: column; gap: 1rem; }

        .lib-actions { display: flex; gap: 0.8rem; }

        /* === GAME DETAIL (NEW LAYOUT) === */
        .game-preview-container { position: relative; width: 100%; border-radius: 24px; overflow: hidden; background: #000; min-height: 400px; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; }

        .play-overlay:hover { background: rgba(0,0,0,0.5); }

        .tags-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .detail-desc { font-size: 1.05rem; line-height: 1.6; color: #cbd5e1; white-space: pre-line; }
        
        .screenshot-gallery { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; margin-top: 1rem; scroll-behavior: smooth; }
        .gallery-img { height: 200px; width: auto; max-width: 90vw; border-radius: 16px; object-fit: cover; border: 1px solid var(--border-glass); flex-shrink:0; }
        
        .comment-item { display: flex; gap: 1rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 16px; margin-bottom: 0.8rem; transition: all 0.3s ease; }
        .c-avatar { font-size: 1.8rem; width: 48px; height: 48px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .c-content { flex: 1; display:flex; flex-direction:column; justify-content:center; }
        
        .msg-status { font-size:0.7rem; text-align:right; margin-top:4px; opacity:0.7; }
        
        .suggested-games { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

        /* === PUBLISHER DASHBOARD & UPLOAD === */
        .stats-row { display: flex; gap: 1.5rem; }
        .stat-card { flex: 1; padding: 1.5rem; border-radius: 20px; text-align: center; }
        .upload-form .form-group { margin-bottom: 1.5rem; }
        .upload-form label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.95rem; }
        .upload-form .row-2 { display: flex; gap: 1.5rem; }
        .upload-form .row-2 > div { flex: 1; }
        .legal-warning { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #fcd34d; padding: 1rem 1.5rem; border-radius: 12px; font-size: 0.9rem; }

        /* === GAME PLAYER MODAL (Legacy) === */
        .fullscreen-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; flex-direction: column; justify-content:center; backdrop-filter:blur(8px); }
        .game-toolbar { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; border-radius: 0; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0a0f1e; flex-shrink:0; }
        .game-iframe { flex: 1; width: 100%; border: none; background: #000; }

        /* === LOADERS & NOTIFICATIONS === */
        .loader-container { padding: 1rem 0; }
        .skeleton-banner { height: 380px; border-radius: 30px; background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        .skeleton-card { height: 280px; border-radius: 20px; background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .global-toast { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-glass); padding: 1rem 1.5rem; border-radius: 16px; color: white; display: flex; align-items: center; gap: 0.8rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; }
        .global-toast.show { transform: translateX(0); opacity: 1; }
        .global-toast.success i { color: var(--success); } .global-toast.error i { color: var(--danger); }

        /* === RESPONSIVE === */
        @media (max-width: 900px) {
            .detail-main-info { flex-direction: column; }
            .detail-actions { width: 100%; }
            .upload-form .row-2 { flex-direction: column; gap: 0; }
        }
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 1rem; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border-glass); }
            .nav-brand { margin-right: 1rem; } .nav-brand span { display: none; }
            .nav-links { flex-direction: row; } .nav-btn { padding: 0.5rem; } .nav-btn span { display: none; }
            .nav-bottom { margin-top: 0; padding-top: 0; border-top: none; display: flex; flex-direction:row; border-left: 1px solid var(--border-glass); padding-left: 1rem; }
            .user-info { display: none; }
            .search-wrapper { max-width: 200px; }
            .stats-badges { display:none !important; }
        }
    </style>
</head>
