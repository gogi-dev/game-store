<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ArcadeForge · Premium HTML Game Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        /*
         * ⚠️ FIRESTORE SECURITY RULES (IMPORTANT)
         * For this app to function correctly, you need to set your Firestore rules to allow read/write access.
         * For testing/development, you can use test mode rules in the Firebase Console:
         * * rules_version = '2';
         * service cloud.firestore {
         * match /databases/{database}/documents {
         * match /{document=**} {
         * allow read, write: if true; // Note: In production, secure this with request.auth != null
         * }
         * }
         * }
         */

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // ========== 🔥 FIREBASE CONFIG (UPDATED WITH PROVIDED CREDS) ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCy5ppRbcHMV1YKtqsrbrwA3GlS3b0P7O8",
            authDomain: "game-store-6779b.firebaseapp.com",
            projectId: "game-store-6779b",
            storageBucket: "game-store-6779b.firebasestorage.app",
            messagingSenderId: "962209191071",
            appId: "1:962209191071:web:6282529b333749cdee3eaa"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Globals for inline handlers
        window.auth = auth;
        window.db = db;
        window.signOut = signOut;
        
        // App State
        window.currentUser = null;
        window.currentView = "store";
        window.allGames = [];
        window.userLibrary = new Map(); // map of gameId -> libraryData (including lastPlayed)
        window.userPrefs = JSON.parse(localStorage.getItem('arcadeForgePrefs')) || { theme: 'dark' };

        // Apply theme early
        document.documentElement.setAttribute('data-theme', window.userPrefs.theme);
        
        const appContainer = document.getElementById('app-root');
        
        window.showToast = (message, type = "info") => {
            const toast = document.getElementById('global-toast');
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            toast.className = `global-toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        };
        
        function sanitizeText(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ========== RENDER ENGINE ==========
        function renderApp() {
            if (!window.currentUser) {
                renderAuthScreen();
                return;
            }
            appContainer.innerHTML = `
                <div class="app-layout fade-in">
                    <nav class="sidebar glass">
                        <div class="nav-brand"><i class="fas fa-gamepad"></i> ArcadeForge</div>
                        <div class="nav-links">
                            <button class="nav-btn active" data-nav="store"><i class="fas fa-store"></i> Store</button>
                            <button class="nav-btn" data-nav="library"><i class="fas fa-layer-group"></i> Library</button>
                            <button class="nav-btn" data-nav="uploads"><i class="fas fa-laptop-code"></i> My Uploads</button>
                            <button class="nav-btn" data-nav="upload"><i class="fas fa-cloud-upload-alt"></i> Publish</button>
                        </div>
                        <div class="nav-bottom">
                            <button class="nav-btn" data-nav="settings"><i class="fas fa-cog"></i> Settings</button>
                            <div class="nav-user">
                                <div class="user-avatar">${window.currentUser.photoURL || '👾'}</div>
                                <div class="user-info">
                                    <span class="u-name">${sanitizeText(window.currentUser.displayName || 'Player')}</span>
                                    <button id="logout-btn" class="logout-text">Logout</button>
                                </div>
                            </div>
                        </div>
                    </nav>
                    <main class="main-content">
                        <header class="top-bar glass">
                            <div class="search-wrapper">
                                <i class="fas fa-search"></i>
                                <input type="text" id="global-search" placeholder="Search games, categories, creators...">
                            </div>
                            <div class="top-actions">
                                <button class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button>
                            </div>
                        </header>
                        <div id="dynamic-view" class="dynamic-view"></div>
                    </main>
                </div>
            `;
            
            document.getElementById('logout-btn')?.addEventListener('click', () => { signOut(auth); });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const view = btn.dataset.nav;
                    if (view === 'store') navigateToStore();
                    else if (view === 'library') navigateToLibrary();
                    else if (view === 'uploads') navigateToMyUploads();
                    else if (view === 'upload') navigateToUpload();
                    else if (view === 'settings') navigateToSettings();
                });
            });

            document.getElementById('global-search')?.addEventListener('keyup', (e) => {
                // Live search connection
                window.searchQuery = e.target.value;
                if (window.currentView === 'store') {
                    // Quick debounce for live update
                    clearTimeout(window.searchTimeout);
                    window.searchTimeout = setTimeout(() => {
                        updateStoreSortAndSearch();
                    }, 300);
                } else if (e.key === 'Enter') {
                    navigateToStore();
                }
            });

            if (window.currentView === "store") navigateToStore();
            else if (window.currentView === "library") navigateToLibrary();
            else navigateToStore();
        }

        // ========== AUTH SCREEN ==========
        function renderAuthScreen() {
            appContainer.innerHTML = `
                <div class="auth-bg">
                    <div class="auth-container fade-in">
                        <div class="auth-card glass">
                            <div class="auth-logo"><i class="fas fa-gamepad"></i> ArcadeForge</div>
                            <p class="auth-subtitle">The Premium HTML Game Marketplace</p>
                            <div class="auth-tabs">
                                <button id="auth-login-tab" class="auth-tab active">Login</button>
                                <button id="auth-signup-tab" class="auth-tab">Sign Up</button>
                            </div>
                            <div id="auth-form-area">
                                <input type="email" id="auth-email" class="input-modern" placeholder="Email Address">
                                <input type="password" id="auth-password" class="input-modern" placeholder="Password">
                                <input type="text" id="auth-username" class="input-modern hidden" placeholder="Username">
                                <div id="emoji-picker-container" class="hidden">
                                    <label class="form-label">Choose Avatar</label>
                                    <div class="emoji-picker-mini">
                                        <span class="emoji-option active" data-emoji="👾">👾</span>
                                        <span class="emoji-option" data-emoji="🦊">🦊</span>
                                        <span class="emoji-option" data-emoji="🤖">🤖</span>
                                        <span class="emoji-option" data-emoji="👻">👻</span>
                                        <span class="emoji-option" data-emoji="🐉">🐉</span>
                                    </div>
                                </div>
                                <button id="auth-action-btn" class="btn-primary w-100 mt-3">Enter Arcade <i class="fas fa-arrow-right"></i></button>
                            </div>
                            <div class="legal-note mt-3"><i class="fas fa-shield-alt"></i> Safe, sandboxed, and curated.</div>
                        </div>
                    </div>
                </div>
            `;

            let isLogin = true;
            let selectedEmoji = "👾";

            const toggleMode = (login) => {
                isLogin = login;
                document.getElementById('auth-login-tab').classList.toggle('active', login);
                document.getElementById('auth-signup-tab').classList.toggle('active', !login);
                document.getElementById('auth-username').classList.toggle('hidden', login);
                document.getElementById('emoji-picker-container').classList.toggle('hidden', login);
                document.getElementById('auth-action-btn').innerHTML = login ? 'Enter Arcade <i class="fas fa-arrow-right"></i>' : 'Create Account';
            };

            document.getElementById('auth-login-tab').addEventListener('click', () => toggleMode(true));
            document.getElementById('auth-signup-tab').addEventListener('click', () => toggleMode(false));

            document.querySelectorAll('.emoji-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.emoji-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    selectedEmoji = opt.dataset.emoji;
                });
            });

            document.getElementById('auth-action-btn').addEventListener('click', async () => {
                const email = document.getElementById('auth-email').value;
                const pwd = document.getElementById('auth-password').value;
                const btn = document.getElementById('auth-action-btn');
                
                if (!email || !pwd) return showToast("Please fill all fields", "error");
                
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;

                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, pwd);
                        showToast("Welcome back!", "success");
                    } else {
                        const username = document.getElementById('auth-username').value;
                        if(!username) throw new Error("Username required");
                        const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                        await updateProfile(cred.user, { displayName: username, photoURL: selectedEmoji });
                        // Save user in users collection
                        await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, username, email, emoji: selectedEmoji, createdAt: serverTimestamp() });
                        showToast("Account created successfully!", "success");
                    }
                } catch(e) { 
                    showToast(e.message.replace('Firebase: ', ''), "error"); 
                    btn.disabled = false;
                    btn.innerHTML = isLogin ? 'Enter Arcade <i class="fas fa-arrow-right"></i>' : 'Create Account';
                }
            });
        }

        // ========== DATA LAYER ==========
        async function fetchGames() {
            try {
                const q = query(collection(db, "games"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                window.allGames = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (e) {
                console.error(e);
                if(window.allGames.length === 0) showToast("Could not load games (check DB rules)", "error");
            }
        }

        async function fetchLibrary() {
            // Using localStorage for Library as requested
            if (!window.currentUser) return;
            try {
                const localData = localStorage.getItem(`arcadeForgeLibrary_${window.currentUser.uid}`);
                const libItems = localData ? JSON.parse(localData) : [];
                window.userLibrary.clear();
                libItems.forEach(item => window.userLibrary.set(item.gameId, item));
            } catch(e) { console.error("Library fetch error", e); }
        }

        // ========== VIEWS ==========
        function showLoader(container) {
            container.innerHTML = `
                <div class="loader-container fade-in">
                    <div class="skeleton-banner"></div>
                    <div class="games-grid mt-3">
                        <div class="skeleton-card"></div><div class="skeleton-card"></div>
                        <div class="skeleton-card"></div><div class="skeleton-card"></div>
                    </div>
                </div>
            `;
        }

        window.updateStoreSortAndSearch = () => {
            const sq = window.searchQuery ? window.searchQuery.toLowerCase() : "";
            let filtered = window.allGames.filter(g => !sq || g.title?.toLowerCase().includes(sq) || g.tags?.some(t=>t.toLowerCase().includes(sq)));
            const sortVal = document.getElementById('sort-select')?.value || 'newest';
            
            if(sortVal === 'popular') filtered.sort((a,b)=>(b.likes||0)-(a.likes||0));
            else filtered.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
            
            const grid = document.getElementById('games-grid');
            if(!grid) return;
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state glass"><h3>No games found</h3><p>Try adjusting your search.</p></div>`;
                return;
            }
            grid.innerHTML = filtered.map(game => {
                const isInstalled = window.userLibrary.has(game.id);
                const isNew = (Date.now() - (game.createdAt?.toMillis() || 0)) < 604800000; // 7 days
                return `
                <div class="game-card glass" onclick="navigateToGameDetail('${game.id}')">
                    <div class="game-image-wrapper">
                        <img src="${game.iconURL || game.iconUrl || 'https://placehold.co/400x300/1e293b/ffffff?text=🎮'}" loading="lazy">
                        ${isNew ? '<span class="card-badge">NEW</span>' : ''}
                    </div>
                    <div class="game-info">
                        <h3 class="truncate">${sanitizeText(game.title)}</h3>
                        <p class="creator-name">by ${sanitizeText(game.creator)}</p>
                        <div class="game-meta">
                            <span><i class="fas fa-thumbs-up text-accent"></i> ${game.likes || 0}</span>
                            <span><i class="fas fa-thumbs-down text-danger"></i> ${game.dislikes || 0}</span>
                        </div>
                        <button class="btn-install w-100 mt-2 ${isInstalled ? 'installed' : ''}" onclick="event.stopPropagation(); toggleInstall('${game.id}')">
                            ${isInstalled ? '<i class="fas fa-check"></i> In Library' : '<i class="fas fa-download"></i> Add to Library'}
                        </button>
                    </div>
                </div>
            `}).join('');
        };

        window.navigateToStore = async () => {
            window.currentView = "store";
            const viewDiv = document.getElementById('dynamic-view');
            showLoader(viewDiv);
            await fetchGames();
            await fetchLibrary();
            
            const games = window.allGames;
            const featured = [...games].sort((a,b)=>(b.likes||0)-(a.likes||0)).slice(0, 3);
            const sq = window.searchQuery ? window.searchQuery.toLowerCase() : "";

            viewDiv.innerHTML = `
                <div class="fade-in">
                    ${featured.length > 0 && !sq ? `
                    <div class="hero-carousel glass">
                        <div class="hero-content">
                            <span class="badge badge-accent">Featured</span>
                            <h1 class="hero-title">${sanitizeText(featured[0].title)}</h1>
                            <p class="hero-desc">${sanitizeText(featured[0].description).substring(0, 150)}...</p>
                            <div class="hero-actions">
                                <button class="btn-primary" onclick="navigateToGameDetail('${featured[0].id}')">View Details</button>
                            </div>
                        </div>
                        <div class="hero-image" style="background-image: url('${featured[0].screenshots?.[0] || featured[0].iconURL || featured[0].iconUrl || 'https://placehold.co/800x400/111827/ffffff?text=No+Image'}')"></div>
                    </div>` : ''}
                    
                    <div class="section-header mt-4">
                        <h2>${sq ? `Search Results for "${sq}"` : 'Discover Games'}</h2>
                        <div class="filters">
                            <select id="sort-select" class="input-modern slim">
                                <option value="newest">Newest Releases</option>
                                <option value="popular">Most Popular</option>
                            </select>
                        </div>
                    </div>
                    <div class="games-grid" id="games-grid"></div>
                </div>
            `;

            document.getElementById('sort-select')?.addEventListener('change', updateStoreSortAndSearch);
            updateStoreSortAndSearch();
        };

        window.navigateToLibrary = async () => {
            window.currentView = "library";
            const viewDiv = document.getElementById('dynamic-view');
            showLoader(viewDiv);
            await fetchGames();
            await fetchLibrary();

            const libGames = window.allGames.filter(g => window.userLibrary.has(g.id));
            // Sort by recently played locally
            libGames.sort((a,b) => (window.userLibrary.get(b.id).lastPlayed || 0) - (window.userLibrary.get(a.id).lastPlayed || 0));

            viewDiv.innerHTML = `
                <div class="fade-in">
                    <div class="section-header"><h2><i class="fas fa-layer-group text-accent"></i> My Library</h2></div>
                    ${libGames.length === 0 ? `
                        <div class="empty-state glass">
                            <i class="fas fa-box-open fa-3x mb-3 text-muted"></i>
                            <h3>Your library is empty</h3>
                            <p>Head over to the Store to discover amazing games.</p>
                            <button class="btn-primary mt-3" onclick="navigateToStore()">Go to Store</button>
                        </div>
                    ` : `
                        <div class="library-list">
                            ${libGames.map(game => {
                                const libData = window.userLibrary.get(game.id);
                                const lastPlayedStr = libData.lastPlayed ? new Date(libData.lastPlayed).toLocaleDateString() : 'Never';
                                return `
                                <div class="lib-item glass">
                                    <img src="${game.iconURL || game.iconUrl}" class="lib-thumb" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=🎮'">
                                    <div class="lib-details">
                                        <h3>${sanitizeText(game.title)}</h3>
                                        <p>Last played: ${lastPlayedStr}</p>
                                    </div>
                                    <div class="lib-actions">
                                        <button class="btn-primary" onclick="launchGame('${game.id}')"><i class="fas fa-play"></i> Play</button>
                                        <button class="btn-icon" title="Remove" onclick="toggleInstall('${game.id}', true)"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                                `
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        };

        window.navigateToMyUploads = async () => {
            window.currentView = "uploads";
            const viewDiv = document.getElementById('dynamic-view');
            showLoader(viewDiv);
            await fetchGames();
            
            const myGames = window.allGames.filter(g => g.ownerId === window.currentUser.uid);
            
            viewDiv.innerHTML = `
                <div class="fade-in">
                    <div class="section-header">
                        <h2><i class="fas fa-laptop-code text-accent"></i> Publisher Dashboard</h2>
                        <button class="btn-primary" onclick="navigateToUpload()"><i class="fas fa-plus"></i> New Game</button>
                    </div>
                    ${myGames.length === 0 ? `
                        <div class="empty-state glass">
                            <i class="fas fa-upload fa-3x mb-3 text-muted"></i>
                            <h3>No uploads yet</h3>
                            <p>Share your creations with the community!</p>
                        </div>
                    ` : `
                        <div class="stats-row mb-4">
                            <div class="stat-card glass">
                                <h4>Total Views/Downloads</h4>
                                <h2>${myGames.reduce((acc, g) => acc + (g.downloads || 0), 0)}</h2>
                            </div>
                            <div class="stat-card glass">
                                <h4>Total Likes</h4>
                                <h2>${myGames.reduce((acc, g) => acc + (g.likes || 0), 0)}</h2>
                            </div>
                        </div>
                        <div class="games-grid">
                            ${myGames.map(game => `
                                <div class="game-card glass" onclick="navigateToGameDetail('${game.id}')">
                                    <div class="game-image-wrapper"><img src="${game.iconURL || game.iconUrl}" loading="lazy"></div>
                                    <div class="game-info">
                                        <h3 class="truncate">${sanitizeText(game.title)}</h3>
                                        <div class="game-meta mt-2">
                                            <span><i class="fas fa-download"></i> ${game.downloads||0}</span>
                                            <span class="badge badge-accent">Manage</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        };

        window.toggleInstall = async (gameId, forceRemove = false) => {
            if(!window.currentUser) return;
            const exists = window.userLibrary.has(gameId);
            
            try {
                if(exists || forceRemove) {
                    if(forceRemove && !confirm("Remove from library?")) return;
                    window.userLibrary.delete(gameId);
                    showToast("Removed from library", "info");
                } else {
                    const gameData = window.allGames.find(g => g.id === gameId);
                    const gameURL = gameData?.gameURL || gameData?.gameFileUrl;
                    window.userLibrary.set(gameId, { gameId, gameURL, addedAt: Date.now(), lastPlayed: null });
                    showToast("Added to library!", "success");
                    // Update downloads count purely for metrics
                    await updateDoc(doc(db,"games",gameId), { downloads: increment(1) });
                }
                
                // Save to localStorage
                localStorage.setItem(`arcadeForgeLibrary_${window.currentUser.uid}`, JSON.stringify(Array.from(window.userLibrary.values())));
                
                // Refresh current view slightly
                if(window.currentView === 'store') {
                    const btn = document.querySelector(`.btn-install[onclick*="${gameId}"]`);
                    if(btn) {
                        const nowInstalled = !exists;
                        btn.className = `btn-install w-100 mt-2 ${nowInstalled ? 'installed' : ''}`;
                        btn.innerHTML = nowInstalled ? '<i class="fas fa-check"></i> In Library' : '<i class="fas fa-download"></i> Add to Library';
                    }
                } else if(window.currentView === 'library') {
                    navigateToLibrary();
                } else if(window.currentView === 'gameDetail') {
                    navigateToGameDetail(gameId);
                }
            } catch(e) { showToast("Error updating library", "error"); }
        };

        window.navigateToGameDetail = async (gameId) => {
            window.currentView = "gameDetail";
            const viewDiv = document.getElementById('dynamic-view');
            showLoader(viewDiv);
            
            try {
                const gameSnap = await getDoc(doc(db,"games",gameId));
                if(!gameSnap.exists()) { navigateToStore(); return; }
                const game = {id: gameSnap.id, ...gameSnap.data()};
                
                const commentsSnap = await getDocs(query(collection(db,"comments"), where("gameId", "==", gameId)));
                // Sort client side because where + orderBy requires composite index
                const comments = commentsSnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
                
                const voteRef = doc(db,"votes", `${window.currentUser.uid}_${gameId}`);
                const voteSnap = await getDoc(voteRef);
                const userVote = voteSnap.exists() ? voteSnap.data().type : null; // 'like' or 'dislike'
                const isInstalled = window.userLibrary.has(gameId);

                viewDiv.innerHTML = `
                    <div class="fade-in">
                        <button class="btn-text mb-3" onclick="navigateToStore()"><i class="fas fa-arrow-left"></i> Back to Store</button>
                        
                        <div class="detail-hero glass">
                            <img src="${game.iconURL || game.iconUrl}" class="detail-icon" onerror="this.src='https://placehold.co/400x400/1e293b/ffffff?text=🎮'">
                            <div class="detail-main-info">
                                <h1>${sanitizeText(game.title)}</h1>
                                <p class="creator-name mb-2">Developed by <strong>${sanitizeText(game.creator)}</strong></p>
                                <div class="tags-row mb-3">
                                    <span class="badge badge-accent">${sanitizeText(game.category || 'Game')}</span>
                                    ${(game.tags||[]).slice(0,3).map(t => `<span class="badge badge-subtle">${sanitizeText(t)}</span>`).join('')}
                                </div>
                                <p class="detail-desc">${sanitizeText(game.description)}</p>
                                
                                <div class="detail-actions mt-4" style="display:flex; align-items:center; gap: 1rem;">
                                    <button class="btn-primary large" onclick="launchGame('${game.id}')"><i class="fas fa-play"></i> Play Now</button>
                                    <button class="btn-secondary large ${isInstalled ? 'active' : ''}" onclick="toggleInstall('${game.id}')">
                                        ${isInstalled ? '<i class="fas fa-check"></i> Library' : '<i class="fas fa-plus"></i> Library'}
                                    </button>
                                    
                                    <div style="display:flex; align-items:center; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 0.2rem;">
                                        <button class="btn-icon ${userVote === 'like' ? 'text-accent' : ''}" onclick="toggleVote('${game.id}', 'like')" id="like-btn" title="Like">
                                            <i class="fas fa-thumbs-up"></i>
                                        </button>
                                        <span class="text-muted" style="margin: 0 0.5rem; font-weight:600;">${game.likes || 0}</span>

            }

        window.toggleVote = async (gameId, voteType) => {
            if (!window.currentUser) return showToast("Log in to vote", "error");
            
            const voteId = `${window.currentUser.uid}_${gameId}`;
            const voteRef = doc(db, "votes", voteId);
            const gameRef = doc(db, "games", gameId);
            
            try {
                const voteSnap = await getDoc(voteRef);
                let currentVote = voteSnap.exists() ? voteSnap.data().type : null;

                if (currentVote === voteType) {
                    // Toggle off the same vote
                    await deleteDoc(voteRef);
                    await updateDoc(gameRef, { [voteType + 's']: increment(-1) });
                } else {
                    // Set new vote
                    await setDoc(voteRef, { gameId, userId: window.currentUser.uid, type: voteType, createdAt: serverTimestamp() });
                    
                    const updates = { [voteType + 's']: increment(1) };
                    if (currentVote) {
                        updates[currentVote + 's'] = increment(-1); // remove old vote
                    }
                    await updateDoc(gameRef, updates);
                }
                
                navigateToGameDetail(gameId); // Refresh to update UI
            } catch(e) { 
                showToast("Error updating vote", "error"); 
            }
        };

        window.postComment = async (gameId) => {
            const text = document.getElementById('new-comment').value.trim();
            if(!text) return;
            try {
                await addDoc(collection(db,"comments"), { 
                    gameId: gameId,
                    userId: window.currentUser.uid,
                    text: text,
                    authorName: window.currentUser.displayName || "Player",
                    authorEmoji: window.currentUser.photoURL || '👾',
                    email: window.currentUser.email,
                    createdAt: serverTimestamp() 
                });
                showToast("Comment posted!", "success");
                navigateToGameDetail(gameId); // reload to show comment
            } catch(e) { showToast("Error posting comment", "error"); }
        };

        window.launchGame = async (gameId) => {
            showToast("Initializing environment...", "info");
            const gameDoc = await getDoc(doc(db,"games",gameId));
            if(!gameDoc.exists()) return;
            const game = gameDoc.data();
            
            // Update last played locally
            if(window.userLibrary.has(gameId)) {
                const ld = window.userLibrary.get(gameId);
                ld.lastPlayed = Date.now();
                window.userLibrary.set(gameId, ld);
                localStorage.setItem(`arcadeForgeLibrary_${window.currentUser.uid}`, JSON.stringify(Array.from(window.userLibrary.values())));
            }

            const playUrl = game.gameURL || game.gameFileUrl;

            if(playUrl) {
                const modal = document.createElement('div');
                modal.className = 'fullscreen-modal fade-in';
                modal.innerHTML = `
                    <div class="game-toolbar glass">
                        <span class="game-title-bar"><i class="fas fa-gamepad"></i> ${sanitizeText(game.title)}</span>
                        <button class="btn-icon text-muted" onclick="this.closest('.fullscreen-modal').remove(); document.body.style.overflow='auto';"><i class="fas fa-times fa-lg"></i></button>
                    </div>
                    <iframe class="game-iframe" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" src="${playUrl}"></iframe>
                `;
                document.body.appendChild(modal);
                document.body.style.overflow = 'hidden';
            } else { 
                showToast("Game executable/URL not found.", "error"); 
            }
        };

        window.navigateToUpload = () => {
            window.currentView = "upload";
            const viewDiv = document.getElementById('dynamic-view');
            viewDiv.innerHTML = `

                        </div>
                        
                        <div class="form-group">

                const title = document.getElementById('up-title').value.trim();
                const creator = document.getElementById('up-creator').value.trim();
                const desc = document.getElementById('up-desc').value.trim();
                const cat = document.getElementById('up-category').value;
                const tags = document.getElementById('up-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
                const iconUrl = document.getElementById('up-icon').value.trim();
                const ssRaw = document.getElementById('up-screenshots').value.trim();
                const ssUrls = ssRaw ? ssRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
                const gameUrl = document.getElementById('up-file').value.trim();

                if(!title || !creator || !desc || !iconUrl || !gameUrl) {
                    return showToast("Please fill all required fields including URLs.", "error");
                }

                this.disabled = true;
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';
                
                try {
                    await addDoc(collection(db, "games"), {
                        title, 
                        creator, 
                        description: desc, 
                        category: cat,

                        iconURL: iconUrl,

        /* === GAME DETAIL === */

        .stat-card h2 { font-size: 2.5rem; font-weight: 800; color: var(--accent); }

        /* === GAME PLAYER MODAL === */
        .fullscreen-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: flex; flex-direction: column; }
        .game-toolbar { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; border-radius: 0; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0a0f1e; }
        .game-title-bar { font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .game-iframe { flex: 1; width: 100%; border: none; background: #000; }

        /* === LOADERS & UTILS === */
        .loader-container { padding: 1rem 0; }
        .skeleton-banner { height: 380px; border-radius: 30px; background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        .skeleton-card { height: 280px; border-radius: 20px; background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .global-toast { position: fixed; bottom: 30px; right: 30px; background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); padding: 1rem 1.5rem; border-radius: 16px; color: white; z-index: 10000; font-weight: 500; display: flex; align-items: center; gap: 0.8rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(100px) scale(0.9); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }

        /* === RESPONSIVE === */

            .upload-form .row-2 { flex-direction: column; gap: 0; }
        }
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 1rem; border-right: none; border-bottom: 1px solid var(--border-glass); overflow-x: auto; }
            .nav-brand { padding: 0; margin-right: 2rem; }

            .top-bar { padding: 0 1rem; }

            .dynamic-view { padding: 1rem; }
            .hero-carousel { padding: 2rem; height: auto; min-height: 300px; }
            .hero-title { font-size: 2rem; }
        }
    </style>
